services:
  istakoza-pos:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: istakoza-pos
    restart: unless-stopped
    init: true
    ports:
      - "${ISTAKOZA_HOST_PORT:-8080}:8080"
    environment:
      ISTAKOZA_DATA: /data
      ISTAKOZA_PORT: 8080
      ISTAKOZA_MODE: ${ISTAKOZA_MODE:-full}
      TZ: ${TZ:-Africa/Cairo}
    volumes:
      - ./data:/data
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
